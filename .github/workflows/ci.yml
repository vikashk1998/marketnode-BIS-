name: BIS Automation CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Playwright grep filter (empty = full suite)'
        required: false
        default: ''

concurrency:
  group: bis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  BIS_FRONTEND_URL: http://localhost:5173
  BIS_BACKEND_URL: http://localhost:8080
  BIS_SFTP_HOST: localhost
  BIS_SFTP_PORT: '2222'
  BIS_LOG_CONSOLE_LEVEL: WARN
  ACR_REGISTRY: interviewmarketnode.azurecr.io

jobs:
  test:
    name: Playwright Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for backend and frontend
        run: |
          set -euo pipefail
          echo "Waiting for BIS stack..."
          for i in $(seq 1 60); do
            if curl -sf "${BIS_BACKEND_URL}/api/system/date" >/dev/null \
              && curl -sf "${BIS_FRONTEND_URL}" >/dev/null; then
              echo "Stack is ready (attempt ${i})"
              curl -sf "${BIS_BACKEND_URL}/api/system/date"
              echo
              exit 0
            fi
            echo "Attempt ${i}/60 — not ready yet"
            sleep 5
          done
          echo "Stack failed to become ready"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Reset business date
        run: |
          curl -sf -X POST "${BIS_BACKEND_URL}/api/system/reset" || true
          curl -sf "${BIS_BACKEND_URL}/api/system/date"
          echo

      - name: Run Playwright tests
        run: |
          mkdir -p reports/html reports/logs test-data/generated
          if [[ -n "${{ github.event.inputs.suite }}" ]]; then
            npx playwright test --grep "${{ github.event.inputs.suite }}"
          else
            ./run-tests.sh
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JUnit / JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            reports/results.json
            reports/junit.xml
            reports/logs/
            reports/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=400

      - name: Tear down stack
        if: always()
        run: docker compose down -v
